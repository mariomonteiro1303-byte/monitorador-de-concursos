name: Monitor de Concursos

on:
  # Executa diariamente às 08:00 no horário de Brasília (11:00 UTC).
  schedule:
    - cron: "0 11 * * *"
  # Permite executar manualmente pela aba Actions do GitHub.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Validar sintaxe Python
        run: python -m py_compile monitor.py

      - name: Executar testes
        run: python -m unittest discover -s tests -v

      - name: Executar monitor
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          ENVIAR_EMAIL: "true"
        run: python monitor.py

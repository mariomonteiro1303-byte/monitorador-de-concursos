name: Teste de envio de e-mail

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  teste-smtp:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testar autenticação e enviar e-mail de teste
        env:
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA: ${{ secrets.EMAIL_SENHA }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
        run: python test_smtp.py
